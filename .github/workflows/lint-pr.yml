name: Lint Changed Files

on:
  pull_request:
    branches: [ master, main, develop ]
    paths:
      - 'api/**/*.go'
      - '.github/workflows/lint-pr.yml'
      - 'api/.golangci.yml'

permissions:
  contents: read

env:
  GO_VERSION: '1.25.5'

jobs:
  lint-changed-files:
    name: Lint Changed Go Files
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for file diff

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: Get changed Go files
        id: changed-files
        run: |
          # Get the base branch (target of PR) - more robust approach
          echo "Base ref: ${{ github.event.pull_request.base.ref }}"
          echo "Head ref: ${{ github.event.pull_request.head.ref }}"
          
          # Ensure we have the base branch
          git fetch origin ${{ github.event.pull_request.base.ref }}:${{ github.event.pull_request.base.ref }} || true
          
          # Use merge-base to find the common ancestor
          BASE_SHA=$(git merge-base origin/${{ github.event.pull_request.base.ref }} HEAD)
          HEAD_SHA="HEAD"
          
          echo "Using base SHA: $BASE_SHA"
          echo "Using head SHA: $HEAD_SHA"
          
          # Get list of changed .go files in the api directory
          CHANGED_FILES=$(git diff --name-only --diff-filter=AM $BASE_SHA...$HEAD_SHA | grep '\.go$' | grep '^api/' | sed 's|^api/||' | tr '\n' ' ' || echo "")
          
          echo "Changed Go files: $CHANGED_FILES"
          
          # Check if we have any Go files to lint
          if [ -z "$CHANGED_FILES" ]; then
            echo "has_go_files=false" >> $GITHUB_OUTPUT
            echo "files=" >> $GITHUB_OUTPUT
          else
            echo "has_go_files=true" >> $GITHUB_OUTPUT
            echo "files=$CHANGED_FILES" >> $GITHUB_OUTPUT
          fi

      - name: Install golangci-lint
        if: steps.changed-files.outputs.has_go_files == 'true'
        env:
          GOLANGCI_LINT_VERSION: v1.62.2
        run: |
          GOBIN=$(go env GOPATH)/bin go install github.com/golangci/golangci-lint/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Run golangci-lint on changed files
        if: steps.changed-files.outputs.has_go_files == 'true'
        run: |
          CHANGED_FILES="${{ steps.changed-files.outputs.files }}"
          echo "Running golangci-lint on: $CHANGED_FILES"
          
          # Use the same merge base logic as file detection
          MERGE_BASE=$(git merge-base origin/${{ github.event.pull_request.base.ref }} HEAD)
          echo "Using merge base for linting: $MERGE_BASE"
          
          # Run golangci-lint only on files changed since the merge base
          golangci-lint run --timeout=5m --new-from-rev=$MERGE_BASE

      - name: No Go files changed
        if: steps.changed-files.outputs.has_go_files == 'false'
        run: |
          echo "No Go files were changed in this PR, skipping lint check."

      - name: Lint failure summary
        if: failure() && steps.changed-files.outputs.has_go_files == 'true'
        run: |
          echo "❌ Linting failed on changed files"
          echo "Please check the workflow logs above for detailed error messages and fix the linting issues before merging."
          echo "The linter only checked files that were modified in this PR to keep feedback focused and fast."
          exit 1
