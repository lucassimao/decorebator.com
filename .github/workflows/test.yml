name: Integration Tests

on:
  push:
    paths:
      - 'api/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/test.yml'

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
  security-events: write

env:
  GO_VERSION: '1.23'
  POSTGRES_USER: test_user
  POSTGRES_PASSWORD: test_pass
  POSTGRES_DB: decorebator_test

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('api/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ env.GO_VERSION }}-
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: |
          # Install gotestsum for better test output formatting
          go install gotest.tools/gotestsum@latest
          
          # Run tests with structured output and junit report
          gotestsum --junitfile unit-tests.xml --format testname -- \
            -v -race -coverprofile=unit.out -covermode=atomic ./internal/...
          
          # Display coverage summary
          go tool cover -func=unit.out
          
          # Ensure test results file exists
          if [ ! -f "unit-tests.xml" ]; then
            echo "Warning: unit-tests.xml not generated, creating empty report"
            cat > unit-tests.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite tests="0" failures="0" time="0" name="Unit Tests">
          </testsuite>
          EOF
          fi
          
      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: api/unit-tests.xml
          
      - name: Generate unit test summary
        if: always()
        run: |
          echo "## 📊 Unit Test Results" >> $GITHUB_STEP_SUMMARY
          if [ -f "unit-tests.xml" ]; then
            # Parse basic info from XML
            TESTS=$(grep -o 'tests="[0-9]*"' unit-tests.xml | grep -o '[0-9]*' || echo "0")
            FAILURES=$(grep -o 'failures="[0-9]*"' unit-tests.xml | grep -o '[0-9]*' || echo "0")
            ERRORS=$(grep -o 'errors="[0-9]*"' unit-tests.xml | grep -o '[0-9]*' || echo "0")
            
            echo "- **Total Tests**: $TESTS" >> $GITHUB_STEP_SUMMARY
            echo "- **Failures**: $FAILURES" >> $GITHUB_STEP_SUMMARY
            echo "- **Errors**: $ERRORS" >> $GITHUB_STEP_SUMMARY
            
            if [ "$FAILURES" = "0" ] && [ "$ERRORS" = "0" ]; then
              echo "✅ All unit tests passed!" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ Some unit tests failed. Check logs above for details." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ No test results file found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload unit test coverage
        uses: codecov/codecov-action@v4
        with:
          file: api/unit.out
          flags: unit
          name: unit-tests
          token: ${{ secrets.CODECOV_TOKEN }}
      
      - name: Upload unit coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: api/unit.out
          
      - name: Upload test reports on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-reports
          path: |
            api/unit-tests.xml
            api/unit.out

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('api/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ env.GO_VERSION }}-
            ${{ runner.os }}-go-

      - name: Start MinIO
        run: |
          docker run -d \
            --name minio-test \
            -p 9001:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          
          # Wait for MinIO to be ready
          timeout 30s bash -c 'until curl -f http://localhost:9001/minio/health/live; do sleep 1; done'

      - name: Download dependencies
        run: go mod download

      - name: Create test environment file
        run: |
          cat > .env.test << EOF
          # Database Configuration
          POSTGRES_USER=${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ env.POSTGRES_DB }}
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5433
          DATABASE_URL=postgres://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5433/${{ env.POSTGRES_DB }}?sslmode=disable
          TEST_DATABASE_URL=postgres://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5433/${{ env.POSTGRES_DB }}?sslmode=disable
          
          # MinIO Configuration
          MINIO_HOST=localhost
          MINIO_PORT=9001
          MINIO_ROOT_USER=minioadmin
          MINIO_ROOT_PASSWORD=minioadmin
          
          # Redis Configuration
          REDIS_URL=redis://localhost:6380
          
          # Test Configuration
          TEST_MODE=true
          JWT_SECRET=test-jwt-secret-key-for-testing-only
          ENV=test
          
          # External API Keys (mock keys for testing)
          OPENAI_API_KEY=test-openai-key-mock
          STRIPE_API_KEY=test-stripe-key-mock
          STRIPE_WEBHOOK_SECRET=test-stripe-webhook-secret
          STRIPE_SUCCESS_URL=http://localhost:8080/subscription/success
          STRIPE_CANCEL_URL=http://localhost:8080/subscription/cancel
          SENDGRID_API_KEY=test-sendgrid-key-mock
          RESET_PASSWORD_PRIVATE_KEY=test-reset-password-key-32-chars
          
          # Feature Flags for Testing
          DISABLE_WORKERS=true
          DISABLE_WEBHOOKS=true
          DISABLE_RATE_LIMITING=false
          DISABLE_EMAIL_SENDING=true
          EOF

      - name: Run database migrations
        run: |
          # Source environment variables
          set -a
          source .env.test
          set +a
          
          # Use Go-based migration runner
          go run ./cmd/migrate/main.go

      - name: Run integration tests
        run: |
          # Install gotestsum for better test output formatting
          go install gotest.tools/gotestsum@latest
          
          # Source environment variables
          set -a
          source .env.test
          set +a
          
          # Run tests with structured output and junit report
          gotestsum --junitfile integration-tests.xml --format testname -- \
            -v -race -coverprofile=integration.out -covermode=atomic ./tests/integration/...
          
          # Display coverage summary
          go tool cover -func=integration.out
          
          # Ensure test results file exists
          if [ ! -f "integration-tests.xml" ]; then
            echo "Warning: integration-tests.xml not generated, creating empty report"
            cat > integration-tests.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite tests="0" failures="0" time="0" name="Integration Tests">
          </testsuite>
          EOF
          fi
          
      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: api/integration-tests.xml
          
      - name: Generate integration test summary
        if: always()
        run: |
          echo "## 🔧 Integration Test Results" >> $GITHUB_STEP_SUMMARY
          if [ -f "integration-tests.xml" ]; then
            # Parse basic info from XML
            TESTS=$(grep -o 'tests="[0-9]*"' integration-tests.xml | grep -o '[0-9]*' || echo "0")
            FAILURES=$(grep -o 'failures="[0-9]*"' integration-tests.xml | grep -o '[0-9]*' || echo "0")
            ERRORS=$(grep -o 'errors="[0-9]*"' integration-tests.xml | grep -o '[0-9]*' || echo "0")
            
            echo "- **Total Tests**: $TESTS" >> $GITHUB_STEP_SUMMARY
            echo "- **Failures**: $FAILURES" >> $GITHUB_STEP_SUMMARY
            echo "- **Errors**: $ERRORS" >> $GITHUB_STEP_SUMMARY
            
            if [ "$FAILURES" = "0" ] && [ "$ERRORS" = "0" ]; then
              echo "✅ All integration tests passed!" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ Some integration tests failed. Check logs above for details." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ No test results file found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload integration test coverage
        uses: codecov/codecov-action@v4
        with:
          file: api/integration.out
          flags: integration
          name: integration-tests
          token: ${{ secrets.CODECOV_TOKEN }}
      
      - name: Upload integration coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: integration-coverage
          path: api/integration.out

      - name: Generate coverage report
        run: |
          go tool cover -html=integration.out -o coverage-integration.html

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: api/coverage-integration.html
          
      - name: Upload test reports on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-test-reports
          path: |
            api/integration-tests.xml
            api/integration.out
            api/.env.test

      - name: Cleanup test containers
        if: always()
        run: |
          docker stop minio-test || true
          docker rm minio-test || true

  lint-checks:
    if: github.event_name == 'pull_request'
    name: Lint Checks (PR Only)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for git diff to work properly

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: Get changed Go files
        id: changed-files
        run: |
          # Get the base branch (target of PR) - more robust approach
          echo "Base ref: ${{ github.event.pull_request.base.ref }}"
          echo "Head ref: ${{ github.event.pull_request.head.ref }}"
          
          # Ensure we have the base branch
          git fetch origin ${{ github.event.pull_request.base.ref }}:${{ github.event.pull_request.base.ref }} || true
          
          # Use merge-base to find the common ancestor
          BASE_SHA=$(git merge-base origin/${{ github.event.pull_request.base.ref }} HEAD)
          HEAD_SHA="HEAD"
          
          echo "Using base SHA: $BASE_SHA"
          echo "Using head SHA: $HEAD_SHA"
          
          # Get list of changed .go files in the api directory
          CHANGED_FILES=$(git diff --name-only --diff-filter=AM $BASE_SHA...$HEAD_SHA | grep '\.go$' | grep '^api/' | sed 's|^api/||' | tr '\n' ' ' || echo "")
          
          echo "Changed Go files: $CHANGED_FILES"
          
          # Check if we have any Go files to lint
          if [ -z "$CHANGED_FILES" ]; then
            echo "has_go_files=false" >> $GITHUB_OUTPUT
            echo "files=" >> $GITHUB_OUTPUT
          else
            echo "has_go_files=true" >> $GITHUB_OUTPUT
            echo "files=$CHANGED_FILES" >> $GITHUB_OUTPUT
          fi

      - name: Run golangci-lint
        if: steps.changed-files.outputs.has_go_files == 'true'
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: ./api
          args: --timeout=10m --new-from-rev=origin/${{ github.event.pull_request.base.ref }}
          install-mode: goinstall



  coverage-check:
    if: false  # Temporarily disabled
    name: Coverage Threshold Check (PR Only)
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    defaults:
      run:
        working-directory: ./api
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download unit coverage
        uses: actions/download-artifact@v4
        with:
          name: unit-coverage
          path: api/

      - name: Download integration coverage
        uses: actions/download-artifact@v4
        with:
          name: integration-coverage
          path: api/

      - name: Check coverage thresholds
        run: |
          echo "Checking unit test coverage threshold (70%)..."
          UNIT_COVERAGE=$(go tool cover -func=unit.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Unit coverage: ${UNIT_COVERAGE}%"
          
          echo "Checking integration test coverage threshold (80%)..."
          INTEGRATION_COVERAGE=$(go tool cover -func=integration.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Integration coverage: ${INTEGRATION_COVERAGE}%"
          
          # Check thresholds
          if (( $(echo "$UNIT_COVERAGE < 70" | bc -l) )); then
            echo "❌ Unit test coverage ($UNIT_COVERAGE%) is below threshold (70%)"
            exit 1
          fi
          
          if (( $(echo "$INTEGRATION_COVERAGE < 80" | bc -l) )); then
            echo "❌ Integration test coverage ($INTEGRATION_COVERAGE%) is below threshold (80%)"
            exit 1
          fi
          
          echo "✅ All coverage thresholds met!"
          echo "📊 Unit: ${UNIT_COVERAGE}% | Integration: ${INTEGRATION_COVERAGE}%"

  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: Build API server
        run: go build -v ./cmd/api

      - name: Build migration tool
        run: go build -v ./cmd/migrate

      - name: Build workers
        run: go build -v ./cmd/workers

      - name: Verify no unused dependencies
        run: go mod tidy && git diff --exit-code go.mod go.sum

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: Run Gosec Security Scanner
        run: |
          # Install gosec from the correct repository
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          
          echo "## 🔒 Security Scan Results" >> $GITHUB_STEP_SUMMARY
          
          # Run gosec and generate SARIF report
          echo "### Gosec Security Analysis" >> $GITHUB_STEP_SUMMARY
          if gosec -fmt sarif -out gosec-results.sarif -stdout -verbose=text ./...; then
            echo "✅ Gosec security scan completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Gosec found potential security issues (see logs above)" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Generate human-readable report for summary
          echo "### Security Issues Summary" >> $GITHUB_STEP_SUMMARY
          gosec -fmt json ./... | jq -r '.Stats | "**Total Issues:** \(.found // 0), **Files Scanned:** \(.num_files // 0)"' >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Issues found - check detailed logs above" >> $GITHUB_STEP_SUMMARY
          
          # Check if SARIF file was created
          if [ -f "gosec-results.sarif" ]; then
            echo "📁 SARIF report generated successfully" >> $GITHUB_STEP_SUMMARY
            echo "🔍 Security results available as artifact (SARIF upload to Security tab requires Code Scanning to be enabled)" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ SARIF report not generated" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Run additional go vet security checks
          echo "### Go Vet Analysis" >> $GITHUB_STEP_SUMMARY
          if go vet ./...; then
            echo "✅ go vet checks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ go vet found potential issues" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('api/gosec-results.sarif') != ''
        continue-on-error: true  # Don't fail if Code Scanning is not enabled
        with:
          sarif_file: api/gosec-results.sarif
          
      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: |
            api/gosec-results.sarif

      - name: Run govulncheck vulnerability scanner
        run: |
          # Install govulncheck
          go install golang.org/x/vuln/cmd/govulncheck@latest
          
          echo "## 🛡️ Vulnerability Scan Results" >> $GITHUB_STEP_SUMMARY
          
          # Run govulncheck and capture results
          if govulncheck ./...; then
            echo "✅ No known vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Potential vulnerabilities detected. Check logs above for details." >> $GITHUB_STEP_SUMMARY
            echo "💡 Run \`govulncheck ./...\` locally for detailed analysis" >> $GITHUB_STEP_SUMMARY
          fi

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, lint-checks, build-verification, security-scan]
    if: always()
    
    steps:
      - name: Generate test summary
        run: |
          echo "## 🚀 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Unit tests status
          echo "### 📊 Test Results Overview" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.unit-tests.result }}" == "success" ]; then
            echo "✅ **Unit Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.unit-tests.result }}" == "failure" ]; then
            echo "❌ **Unit Tests**: Failed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.unit-tests.result }}" == "cancelled" ]; then
            echo "⏹️ **Unit Tests**: Cancelled" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Unit Tests**: ${{ needs.unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Integration tests status  
          if [ "${{ needs.integration-tests.result }}" == "success" ]; then
            echo "✅ **Integration Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.integration-tests.result }}" == "failure" ]; then
            echo "❌ **Integration Tests**: Failed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.integration-tests.result }}" == "cancelled" ]; then
            echo "⏹️ **Integration Tests**: Cancelled" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Integration Tests**: ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Lint checks status
          if [ "${{ needs.lint-checks.result }}" == "success" ]; then
            echo "✅ **Lint Checks**: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.lint-checks.result }}" == "skipped" ]; then
            echo "⏭️ **Lint Checks**: Skipped (PR only)" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.lint-checks.result }}" == "failure" ]; then
            echo "❌ **Lint Checks**: Failed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.lint-checks.result }}" == "cancelled" ]; then
            echo "⏹️ **Lint Checks**: Cancelled" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Lint Checks**: ${{ needs.lint-checks.result }}" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Build verification status
          if [ "${{ needs.build-verification.result }}" == "success" ]; then
            echo "✅ **Build Verification**: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.build-verification.result }}" == "failure" ]; then
            echo "❌ **Build Verification**: Failed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.build-verification.result }}" == "cancelled" ]; then
            echo "⏹️ **Build Verification**: Cancelled" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Build Verification**: ${{ needs.build-verification.result }}" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Security scan status
          if [ "${{ needs.security-scan.result }}" == "success" ]; then
            echo "✅ **Security Scan**: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.security-scan.result }}" == "failure" ]; then
            echo "❌ **Security Scan**: Failed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.security-scan.result }}" == "cancelled" ]; then
            echo "⏹️ **Security Scan**: Cancelled" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Security Scan**: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Calculate and display summary statistics
          PASSED=0
          FAILED=0
          SKIPPED=0
          OTHER=0
          
          # Count results
          [ "${{ needs.unit-tests.result }}" == "success" ] && PASSED=$((PASSED + 1)) || [ "${{ needs.unit-tests.result }}" == "failure" ] && FAILED=$((FAILED + 1)) || [ "${{ needs.unit-tests.result }}" == "skipped" ] && SKIPPED=$((SKIPPED + 1)) || OTHER=$((OTHER + 1))
          [ "${{ needs.integration-tests.result }}" == "success" ] && PASSED=$((PASSED + 1)) || [ "${{ needs.integration-tests.result }}" == "failure" ] && FAILED=$((FAILED + 1)) || [ "${{ needs.integration-tests.result }}" == "skipped" ] && SKIPPED=$((SKIPPED + 1)) || OTHER=$((OTHER + 1))
          [ "${{ needs.build-verification.result }}" == "success" ] && PASSED=$((PASSED + 1)) || [ "${{ needs.build-verification.result }}" == "failure" ] && FAILED=$((FAILED + 1)) || [ "${{ needs.build-verification.result }}" == "skipped" ] && SKIPPED=$((SKIPPED + 1)) || OTHER=$((OTHER + 1))
          [ "${{ needs.security-scan.result }}" == "success" ] && PASSED=$((PASSED + 1)) || [ "${{ needs.security-scan.result }}" == "failure" ] && FAILED=$((FAILED + 1)) || [ "${{ needs.security-scan.result }}" == "skipped" ] && SKIPPED=$((SKIPPED + 1)) || OTHER=$((OTHER + 1))
          
          # Handle lint checks separately since it can be skipped
          if [ "${{ needs.lint-checks.result }}" == "success" ] || [ "${{ needs.lint-checks.result }}" == "skipped" ]; then
            if [ "${{ needs.lint-checks.result }}" == "success" ]; then
              PASSED=$((PASSED + 1))
            else
              SKIPPED=$((SKIPPED + 1))
            fi
          elif [ "${{ needs.lint-checks.result }}" == "failure" ]; then
            FAILED=$((FAILED + 1))
          else
            OTHER=$((OTHER + 1))
          fi
          
          echo "### 📈 Summary Statistics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Passed**: $PASSED" >> $GITHUB_STEP_SUMMARY
          echo "- ❌ **Failed**: $FAILED" >> $GITHUB_STEP_SUMMARY
          if [ $SKIPPED -gt 0 ]; then
            echo "- ⏭️ **Skipped**: $SKIPPED" >> $GITHUB_STEP_SUMMARY
          fi
          if [ $OTHER -gt 0 ]; then
            echo "- ⚠️ **Other**: $OTHER" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Overall result
          if [ $FAILED -eq 0 ] && [ $OTHER -eq 0 ]; then
            echo "🎉 **Overall Result**: All required checks passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Overall Result**: Some checks failed - see details above" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 **View detailed test reports above for specific failure information**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔍 Quick Debugging Tips" >> $GITHUB_STEP_SUMMARY
          echo "- **For unit test failures**: Check the 'Unit Test Results' section above" >> $GITHUB_STEP_SUMMARY
          echo "- **For integration test failures**: Download 'integration-test-reports' artifact for detailed logs" >> $GITHUB_STEP_SUMMARY
          echo "- **For lint failures**: Look at the golangci-lint action output" >> $GITHUB_STEP_SUMMARY
          echo "- **For security issues**: Download 'security-scan-results' artifact for SARIF report" >> $GITHUB_STEP_SUMMARY
          echo "- **Enable Code Scanning**: Go to Settings > Security > Code scanning to enable automatic SARIF uploads" >> $GITHUB_STEP_SUMMARY
          echo "- **Local testing**: Run \`make test-report\` for structured test output" >> $GITHUB_STEP_SUMMARY
          
      - name: Check overall status
        run: |
          if [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.integration-tests.result }}" != "success" ] || \
             [ "${{ needs.build-verification.result }}" != "success" ] || \
             [ "${{ needs.security-scan.result }}" != "success" ] || \
             ([ "${{ needs.lint-checks.result }}" != "success" ] && [ "${{ needs.lint-checks.result }}" != "skipped" ]); then
            echo "❌ One or more required checks failed"
            exit 1
          else
            echo "✅ All checks passed successfully"
          fi