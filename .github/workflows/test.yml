name: Integration Tests

on:
  push:
    paths:
      - 'api/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/test.yml'

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
  security-events: write

env:
  GO_VERSION: '1.25.5'
  POSTGRES_USER: test_user
  POSTGRES_PASSWORD: test_pass
  POSTGRES_DB: decorebator_test

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('api/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ env.GO_VERSION }}-
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: |
          # Install gotestsum for better test output formatting
          go install gotest.tools/gotestsum@latest
          
          # Run tests with structured output and junit report
          # Use pkgname-and-test-fails format for better failure visibility
          gotestsum --junitfile unit-tests.xml --format pkgname-and-test-fails --jsonfile unit-tests.json -- \
            -v -race -coverprofile=unit.out -covermode=atomic ./internal/...
          
          # Display coverage summary
          go tool cover -func=unit.out
          
          # Ensure test results file exists
          if [ ! -f "unit-tests.xml" ]; then
            echo "Warning: unit-tests.xml not generated, creating empty report"
            cat > unit-tests.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite tests="0" failures="0" time="0" name="Unit Tests">
          </testsuite>
          EOF
          fi
          
      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            api/unit-tests.xml
            api/unit-tests.json
          
      - name: Generate unit test summary
        if: always()
        run: |
          echo "## 📊 Unit Test Results" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "unit-tests.xml" ]; then
            # Parse basic info from XML
            TESTS=$(grep -o 'tests="[0-9]*"' unit-tests.xml | grep -o '[0-9]*' || echo "0")
            FAILURES=$(grep -o 'failures="[0-9]*"' unit-tests.xml | grep -o '[0-9]*' || echo "0")
            ERRORS=$(grep -o 'errors="[0-9]*"' unit-tests.xml | grep -o '[0-9]*' || echo "0")
            
            # Extract coverage percentage
            COVERAGE="N/A"
            if [ -f "unit.out" ]; then
              COVERAGE=$(go tool cover -func=unit.out | grep total | awk '{print $3}' || echo "N/A")
            fi
            
            echo "### 📈 Test Summary" >> $GITHUB_STEP_SUMMARY
            echo "- **Total Tests**: $TESTS" >> $GITHUB_STEP_SUMMARY
            echo "- **Failures**: $FAILURES" >> $GITHUB_STEP_SUMMARY
            echo "- **Errors**: $ERRORS" >> $GITHUB_STEP_SUMMARY
            echo "- **Coverage**: $COVERAGE" >> $GITHUB_STEP_SUMMARY
            
            if [ "$FAILURES" = "0" ] && [ "$ERRORS" = "0" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              if [ "$COVERAGE" != "N/A" ]; then
                COVERAGE_NUM=$(echo $COVERAGE | sed 's/%//')
                if (( $(echo "$COVERAGE_NUM >= 70" | bc -l) 2>/dev/null )); then
                  echo "✅ **All unit tests passed!** Coverage: $COVERAGE ≥ 70% target" >> $GITHUB_STEP_SUMMARY
                else
                  echo "⚠️ **Unit tests passed but coverage below target** Coverage: $COVERAGE < 70%" >> $GITHUB_STEP_SUMMARY
                fi
              else
                echo "✅ **All unit tests passed!**" >> $GITHUB_STEP_SUMMARY
              fi
            else
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "❌ **Some unit tests failed**" >> $GITHUB_STEP_SUMMARY
              
              # Extract failed test details from XML
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### 🚨 Failed Tests Details" >> $GITHUB_STEP_SUMMARY
              
              # Use awk to parse XML and extract failure details
              awk '
              BEGIN { in_testcase = 0; test_name = ""; failure_msg = "" }
              /<testcase/ { 
                in_testcase = 1
                # Extract test name from testcase tag
                match($0, /name="([^"]*)"/, arr)
                test_name = arr[1]
              }
              /<failure/ && in_testcase {
                getline failure_line
                # Extract failure message (remove CDATA wrapper if present)
                gsub(/^[[:space:]]*<!\[CDATA\[/, "", failure_line)
                gsub(/\]\]>[[:space:]]*$/, "", failure_line)
                failure_msg = failure_line
                print "#### ❌ " test_name
                print "```"
                print failure_msg
                print "```"
                print ""
              }
              /<\/testcase>/ { in_testcase = 0; test_name = ""; failure_msg = "" }
              ' unit-tests.xml >> $GITHUB_STEP_SUMMARY
              
              # If JSON file exists, try to extract additional timing information
              if [ -f "unit-tests.json" ]; then
                echo "### ⏱️ Test Execution Details" >> $GITHUB_STEP_SUMMARY
                
                # Extract failed tests with timing from JSON using jq if available
                if command -v jq >/dev/null 2>&1; then
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "| Test Name | Status | Duration |" >> $GITHUB_STEP_SUMMARY
                  echo "|-----------|--------|----------|" >> $GITHUB_STEP_SUMMARY
                  
                  # Parse JSON for test results
                  jq -r '
                  select(.Action == "fail" and .Test != null) |
                  "| \(.Package).\(.Test) | ❌ FAIL | \(.Elapsed // "N/A")s |"
                  ' unit-tests.json >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "| JSON parsing failed | - | - |" >> $GITHUB_STEP_SUMMARY
                  
                  echo "" >> $GITHUB_STEP_SUMMARY
                else
                  echo "jq not available for JSON parsing" >> $GITHUB_STEP_SUMMARY
                fi
              fi
              
              echo "📝 **Check the full logs above for complete error details and stack traces.**" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ No test results file found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload unit test coverage
        uses: codecov/codecov-action@v4
        with:
          file: api/unit.out
          flags: unit
          name: unit-tests
          token: ${{ secrets.CODECOV_TOKEN }}
      
      - name: Upload unit coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: api/unit.out
          
      - name: Upload test reports on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-reports
          path: |
            api/unit-tests.xml
            api/unit-tests.json
            api/unit.out

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('api/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ env.GO_VERSION }}-
            ${{ runner.os }}-go-

      - name: Start MinIO
        run: |
          docker run -d \
            --name minio-test \
            -p 9001:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          
          # Wait for MinIO to be ready
          timeout 30s bash -c 'until curl -f http://localhost:9001/minio/health/live; do sleep 1; done'

      - name: Download dependencies
        run: go mod download

      - name: Create test environment file
        run: |
          cat > .env.test << EOF
          # Database Configuration
          POSTGRES_USER=${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ env.POSTGRES_DB }}
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5433
          DATABASE_URL=postgres://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5433/${{ env.POSTGRES_DB }}?sslmode=disable
          TEST_DATABASE_URL=postgres://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5433/${{ env.POSTGRES_DB }}?sslmode=disable
          
          # MinIO Configuration
          MINIO_HOST=localhost
          MINIO_PORT=9001
          MINIO_ROOT_USER=minioadmin
          MINIO_ROOT_PASSWORD=minioadmin
          
          # Redis Configuration
          REDIS_URL=redis://localhost:6380
          
          # Test Configuration
          TEST_MODE=true
          JWT_KEY=test-jwt-secret-key-for-testing-only
          ENV=test
          
          # External API Keys (mock keys for testing)
          OPENAI_API_KEY=test-openai-key-mock
          STRIPE_API_KEY=test-stripe-key-mock
          STRIPE_WEBHOOK_SECRET=test-stripe-webhook-secret
          STRIPE_SUCCESS_URL=http://localhost:8080/subscription/success
          STRIPE_CANCEL_URL=http://localhost:8080/subscription/cancel
          STRIPE_PRICE_ID_MONTHLY=price_monthly_test
          STRIPE_PRICE_ID_ANNUAL=price_annual_test
          SENDGRID_API_KEY=test-sendgrid-key-mock
          RESET_PASSWORD_PRIVATE_KEY=test-reset-password-key-32-chars
          
          # RevenueCat Configuration (mock keys for testing)
          REVENUECAT_API_KEY=test-revenuecat-ios-key
          REVENUECAT_WEBHOOK_AUTHORIZATION=test_webhook_secret
          
          # Feature Flags for Testing
          DISABLE_WORKERS=true
          DISABLE_WEBHOOKS=true
          DISABLE_RATE_LIMITING=false
          DISABLE_EMAIL_SENDING=true
          EOF

      - name: Run database migrations
        run: |
          # Source environment variables
          set -a
          source .env.test
          set +a
          
          # Use Go-based migration runner
          go run ./cmd/migrate/main.go

      - name: Run integration tests
        run: |
          # Install gotestsum for better test output formatting
          go install gotest.tools/gotestsum@latest
          
          # Source environment variables
          set -a
          source .env.test
          set +a
          
          # Run tests with structured output and junit report
          # Use pkgname-and-test-fails format for better failure visibility
          gotestsum --junitfile integration-tests.xml --format pkgname-and-test-fails --jsonfile integration-tests.json -- \
            -v -race -count=1 -p=1 -coverprofile=integration.out -covermode=atomic ./tests/integration/...
          
          # Display coverage summary
          go tool cover -func=integration.out
          
          # Ensure test results file exists
          if [ ! -f "integration-tests.xml" ]; then
            echo "Warning: integration-tests.xml not generated, creating empty report"
            cat > integration-tests.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite tests="0" failures="0" time="0" name="Integration Tests">
          </testsuite>
          EOF
          fi
          
      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: |
            api/integration-tests.xml
            api/integration-tests.json
          
      - name: Generate integration test summary
        if: always()
        run: |
          echo "## 🔧 Integration Test Results" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "integration-tests.xml" ]; then
            # Parse basic info from XML
            TESTS=$(grep -o 'tests="[0-9]*"' integration-tests.xml | grep -o '[0-9]*' || echo "0")
            FAILURES=$(grep -o 'failures="[0-9]*"' integration-tests.xml | grep -o '[0-9]*' || echo "0")
            ERRORS=$(grep -o 'errors="[0-9]*"' integration-tests.xml | grep -o '[0-9]*' || echo "0")
            
            # Extract coverage percentage
            COVERAGE="N/A"
            if [ -f "integration.out" ]; then
              COVERAGE=$(go tool cover -func=integration.out | grep total | awk '{print $3}' || echo "N/A")
            fi
            
            echo "### 📊 Test Summary" >> $GITHUB_STEP_SUMMARY
            echo "- **Total Tests**: $TESTS" >> $GITHUB_STEP_SUMMARY
            echo "- **Failures**: $FAILURES" >> $GITHUB_STEP_SUMMARY
            echo "- **Errors**: $ERRORS" >> $GITHUB_STEP_SUMMARY
            echo "- **Coverage**: $COVERAGE" >> $GITHUB_STEP_SUMMARY
            
            if [ "$FAILURES" = "0" ] && [ "$ERRORS" = "0" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              if [ "$COVERAGE" != "N/A" ]; then
                COVERAGE_NUM=$(echo $COVERAGE | sed 's/%//')
                if (( $(echo "$COVERAGE_NUM >= 80" | bc -l) 2>/dev/null )); then
                  echo "✅ **All integration tests passed!** Coverage: $COVERAGE ≥ 80% target" >> $GITHUB_STEP_SUMMARY
                else
                  echo "⚠️ **Integration tests passed but coverage below target** Coverage: $COVERAGE < 80%" >> $GITHUB_STEP_SUMMARY
                fi
              else
                echo "✅ **All integration tests passed!**" >> $GITHUB_STEP_SUMMARY
              fi
            else
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "❌ **Some integration tests failed**" >> $GITHUB_STEP_SUMMARY
              
              # Extract failed test details from XML
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### 🚨 Failed Tests Details" >> $GITHUB_STEP_SUMMARY
              
              # Use awk to parse XML and extract failure details
              awk '
              BEGIN { in_testcase = 0; test_name = ""; failure_msg = "" }
              /<testcase/ { 
                in_testcase = 1
                # Extract test name from testcase tag
                match($0, /name="([^"]*)"/, arr)
                test_name = arr[1]
              }
              /<failure/ && in_testcase {
                getline failure_line
                # Extract failure message (remove CDATA wrapper if present)
                gsub(/^[[:space:]]*<!\[CDATA\[/, "", failure_line)
                gsub(/\]\]>[[:space:]]*$/, "", failure_line)
                failure_msg = failure_line
                print "#### ❌ " test_name
                print "```"
                print failure_msg
                print "```"
                print ""
              }
              /<\/testcase>/ { in_testcase = 0; test_name = ""; failure_msg = "" }
              ' integration-tests.xml >> $GITHUB_STEP_SUMMARY
              
              # If JSON file exists, try to extract additional timing information
              if [ -f "integration-tests.json" ]; then
                echo "### ⏱️ Test Execution Details" >> $GITHUB_STEP_SUMMARY
                
                # Extract failed tests with timing from JSON using jq if available
                if command -v jq >/dev/null 2>&1; then
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "| Test Name | Status | Duration |" >> $GITHUB_STEP_SUMMARY
                  echo "|-----------|--------|----------|" >> $GITHUB_STEP_SUMMARY
                  
                  # Parse JSON for test results
                  jq -r '
                  select(.Action == "fail" and .Test != null) |
                  "| \(.Package).\(.Test) | ❌ FAIL | \(.Elapsed // "N/A")s |"
                  ' integration-tests.json >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "| JSON parsing failed | - | - |" >> $GITHUB_STEP_SUMMARY
                  
                  echo "" >> $GITHUB_STEP_SUMMARY
                else
                  echo "jq not available for JSON parsing" >> $GITHUB_STEP_SUMMARY
                fi
              fi
              
              echo "📝 **Check the full logs above for complete error details and stack traces.**" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ No test results file found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload integration test coverage
        uses: codecov/codecov-action@v4
        with:
          file: api/integration.out
          flags: integration
          name: integration-tests
          token: ${{ secrets.CODECOV_TOKEN }}
      
      - name: Upload integration coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: integration-coverage
          path: api/integration.out

      - name: Generate coverage report
        run: |
          go tool cover -html=integration.out -o coverage-integration.html

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: api/coverage-integration.html
          
      - name: Upload test reports on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-test-reports
          path: |
            api/integration-tests.xml
            api/integration-tests.json
            api/integration.out
            api/.env.test

      - name: Cleanup test containers
        if: always()
        run: |
          docker stop minio-test || true
          docker rm minio-test || true

  lint-checks:
    if: github.event_name == 'pull_request'
    name: Lint Checks (PR Only)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for git diff to work properly

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: Get changed Go files
        id: changed-files
        run: |
          # Get the base branch (target of PR) - more robust approach
          echo "Base ref: ${{ github.event.pull_request.base.ref }}"
          echo "Head ref: ${{ github.event.pull_request.head.ref }}"
          
          # Ensure we have the base branch
          git fetch origin ${{ github.event.pull_request.base.ref }}:${{ github.event.pull_request.base.ref }} || true
          
          # Use merge-base to find the common ancestor
          BASE_SHA=$(git merge-base origin/${{ github.event.pull_request.base.ref }} HEAD)
          HEAD_SHA="HEAD"
          
          echo "Using base SHA: $BASE_SHA"
          echo "Using head SHA: $HEAD_SHA"
          
          # Get list of changed .go files in the api directory
          CHANGED_FILES=$(git diff --name-only --diff-filter=AM $BASE_SHA...$HEAD_SHA | grep '\.go$' | grep '^api/' | sed 's|^api/||' | tr '\n' ' ' || echo "")
          
          echo "Changed Go files: $CHANGED_FILES"
          
          # Check if we have any Go files to lint
          if [ -z "$CHANGED_FILES" ]; then
            echo "has_go_files=false" >> $GITHUB_OUTPUT
            echo "files=" >> $GITHUB_OUTPUT
          else
            echo "has_go_files=true" >> $GITHUB_OUTPUT
            echo "files=$CHANGED_FILES" >> $GITHUB_OUTPUT
          fi

      - name: Run golangci-lint
        if: steps.changed-files.outputs.has_go_files == 'true'
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2
          working-directory: ./api
          args: --timeout=10m --new-from-rev=origin/${{ github.event.pull_request.base.ref }}
          install-mode: goinstall



  coverage-check:
    if: false  # Temporarily disabled
    name: Coverage Threshold Check (PR Only)
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    defaults:
      run:
        working-directory: ./api
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download unit coverage
        uses: actions/download-artifact@v4
        with:
          name: unit-coverage
          path: api/

      - name: Download integration coverage
        uses: actions/download-artifact@v4
        with:
          name: integration-coverage
          path: api/

      - name: Check coverage thresholds
        run: |
          echo "Checking unit test coverage threshold (70%)..."
          UNIT_COVERAGE=$(go tool cover -func=unit.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Unit coverage: ${UNIT_COVERAGE}%"
          
          echo "Checking integration test coverage threshold (80%)..."
          INTEGRATION_COVERAGE=$(go tool cover -func=integration.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Integration coverage: ${INTEGRATION_COVERAGE}%"
          
          # Check thresholds
          if (( $(echo "$UNIT_COVERAGE < 70" | bc -l) )); then
            echo "❌ Unit test coverage ($UNIT_COVERAGE%) is below threshold (70%)"
            exit 1
          fi
          
          if (( $(echo "$INTEGRATION_COVERAGE < 80" | bc -l) )); then
            echo "❌ Integration test coverage ($INTEGRATION_COVERAGE%) is below threshold (80%)"
            exit 1
          fi
          
          echo "✅ All coverage thresholds met!"
          echo "📊 Unit: ${UNIT_COVERAGE}% | Integration: ${INTEGRATION_COVERAGE}%"

  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: Build API server
        run: go build -v ./cmd/api

      - name: Build migration tool
        run: go build -v ./cmd/migrate

      - name: Build workers
        run: go build -v ./cmd/workers

      - name: Verify no unused dependencies
        run: go mod tidy && git diff --exit-code go.mod go.sum

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: Run Gosec Security Scanner
        run: |
          # Install gosec from the correct repository
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          
          echo "## 🔒 Security Scan Results" >> $GITHUB_STEP_SUMMARY
          
          # Run gosec and generate SARIF report
          echo "### Gosec Security Analysis" >> $GITHUB_STEP_SUMMARY
          if gosec -fmt sarif -out gosec-results.sarif -stdout -verbose=text ./...; then
            echo "✅ Gosec security scan completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Gosec found potential security issues (see logs above)" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Generate human-readable report for summary
          echo "### Security Issues Summary" >> $GITHUB_STEP_SUMMARY
          gosec -fmt json ./... | jq -r '.Stats | "**Total Issues:** \(.found // 0), **Files Scanned:** \(.num_files // 0)"' >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Issues found - check detailed logs above" >> $GITHUB_STEP_SUMMARY
          
          # Check if SARIF file was created
          if [ -f "gosec-results.sarif" ]; then
            echo "📁 SARIF report generated successfully" >> $GITHUB_STEP_SUMMARY
            echo "🔍 Security results available as artifact (SARIF upload to Security tab requires Code Scanning to be enabled)" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ SARIF report not generated" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Run additional go vet security checks
          echo "### Go Vet Analysis" >> $GITHUB_STEP_SUMMARY
          if go vet ./...; then
            echo "✅ go vet checks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ go vet found potential issues" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('api/gosec-results.sarif') != ''
        continue-on-error: true  # Don't fail if Code Scanning is not enabled
        with:
          sarif_file: api/gosec-results.sarif
          
      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: |
            api/gosec-results.sarif

      - name: Run govulncheck vulnerability scanner
        run: |
          # Install govulncheck
          go install golang.org/x/vuln/cmd/govulncheck@latest
          
          echo "## 🛡️ Vulnerability Scan Results" >> $GITHUB_STEP_SUMMARY
          
          # Run govulncheck and capture results
          if govulncheck ./...; then
            echo "✅ No known vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Potential vulnerabilities detected. Check logs above for details." >> $GITHUB_STEP_SUMMARY
            echo "💡 Run \`govulncheck ./...\` locally for detailed analysis" >> $GITHUB_STEP_SUMMARY
          fi

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, lint-checks, build-verification, security-scan]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: "*-coverage"
          path: coverage/

      - name: Generate test summary
        run: |
          {
            echo "## 🚀 Test Results Summary"
            echo ""
            echo "### Test Status"
            echo "- **Unit Tests**: ${{ needs.unit-tests.result }}"
            echo "- **Integration Tests**: ${{ needs.integration-tests.result }}"
            echo "- **Lint Checks**: ${{ needs.lint-checks.result }}"
            echo "- **Build Verification**: ${{ needs.build-verification.result }}"
            echo "- **Security Scan**: ${{ needs.security-scan.result }}"
            echo ""
            
            # Display coverage information if available
            echo "### 📊 Coverage Results"
            UNIT_COVERAGE="N/A"
            INTEGRATION_COVERAGE="N/A"
            
            if [ -f "coverage/unit-coverage/unit.out" ]; then
              UNIT_COVERAGE=$(go tool cover -func=coverage/unit-coverage/unit.out | grep total | awk '{print $3}' || echo "N/A")
            fi
            
            if [ -f "coverage/integration-coverage/integration.out" ]; then
              INTEGRATION_COVERAGE=$(go tool cover -func=coverage/integration-coverage/integration.out | grep total | awk '{print $3}' || echo "N/A")
            fi
            
            echo "- **Unit Test Coverage**: $UNIT_COVERAGE (Target: ≥70%)"
            echo "- **Integration Test Coverage**: $INTEGRATION_COVERAGE (Target: ≥80%)"
            echo ""
            
            echo "### Quick Status"
            if [ "${{ needs.integration-tests.result }}" == "failure" ]; then
              echo "❌ **Integration tests failed** - Check logs above for details"
            elif [ "${{ needs.unit-tests.result }}" == "failure" ]; then
              echo "❌ **Unit tests failed** - Check logs above for details"
            else
              echo "✅ **All tests passed!**"
            fi
            
            # Add coverage links
            echo ""
            echo "### 📈 Coverage Reports"
            echo "- [📋 Codecov Dashboard](https://codecov.io/gh/${{ github.repository }})"
            echo "- [📊 Coverage Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> $GITHUB_STEP_SUMMARY
