# golangci-lint configuration for Decorebator API
# Documentation: https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true

linters:
  enable:
    # Default linters
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    
    # Additional linters
    - bodyclose
    - dogsled
    - dupl
    - copyloopvar
    - goconst
    - gocyclo
    - gofmt
    - goimports
    - goprintffuncname
    - gosec
    - misspell
    - nakedret
    - nolintlint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
    - whitespace

  disable:
    - depguard
    - exhaustive
    - gochecknoglobals
    - godox
    - err113
    - lll
    - nlreturn
    - testpackage
    - wsl

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: false
    exclude-functions:
      - io.Copy
      - fmt.Fprint
      - fmt.Fprintf
      - fmt.Fprintln
      - strings.Builder.WriteString
      - strings.Builder.Write
      - strings.Builder.WriteByte
      - strings.Builder.WriteRune

  govet:
    enable:
      - shadow
    settings:
      printf:
        funcs:
          - (github.com/sirupsen/logrus.Logger).Debugf
          - (github.com/sirupsen/logrus.Logger).Infof
          - (github.com/sirupsen/logrus.Logger).Warnf
          - (github.com/sirupsen/logrus.Logger).Errorf
          - (github.com/sirupsen/logrus.Logger).Fatalf

  gocyclo:
    min-complexity: 20

  dupl:
    threshold: 150

  goconst:
    min-len: 3
    min-occurrences: 3

  misspell:
    locale: US

  unparam:
    check-exported: false

  nakedret:
    max-func-lines: 30

  gosec:
    excludes:
      - G104
      - G304

issues:
  exclude-files:
    - ".*\\.pb\\.go$"
    - ".*\\.gen\\.go$"
  
  exclude-dirs:
    - vendor
    - bin
    - docs
    - scripts
    
  exclude:
    - "Using the variable on range scope .* in function literal"
    - "don't use `init` function"
    - "don't use global variable"
    
  exclude-rules:
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - dupl
        - gosec
        - goconst
    
    - path: vendor/
      linters:
        - typecheck
        - unused
        - errcheck
        - gosec
    
    - path: cmd/
      linters:
        - gocyclo
        - dupl
    
    - path: internal/service/
      text: "don't use global variable"
      linters:
        - gochecknoglobals
    
    - path: (cmd/|internal/http/setup\.go|internal/service/)
      text: "don't use `init` function"
      linters:
        - gochecknoinits

  max-issues-per-linter: 50
  max-same-issues: 3
  fix: false

severity:
  default-severity: warning
  case-sensitive: false
  
  rules:
    - linters:
        - gosec
      severity: error
    - linters:
        - errcheck
      severity: error
    - linters:
        - staticcheck
      severity: error