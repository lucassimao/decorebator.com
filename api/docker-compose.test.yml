name: decorebator-test
services:
  
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    tmpfs:
      - /data  # In-memory for speed
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: testuser
      MINIO_ROOT_PASSWORD: testpass123
    env_file:
      - .env.test
    ports:
      - "9009:9000"
      - "9091:9001"
    command: server /data --console-address ":9001"
    tmpfs:
      - /data  # In-memory for speed
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      set -eu;
      mc alias set myminio http://minio:9000 testuser testpass123;
      mc mb --ignore-existing myminio/decorebator;
      mc anonymous set download myminio/decorebator;"

  main:                         
    image: golang:1.25.5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    volumes:
      - .:/app    
      - go-mod-cache:/go/pkg/mod
    working_dir: /app
    command: go test -race -count=1 -p=1 -coverpkg=./internal/... -coverprofile=coverage.out -covermode=atomic -v ./tests/integration/...
    env_file:
      - .env.test
    environment:
      DATABASE_URL: postgres://test_user:test_pass@postgres:5432/decorebator_test?sslmode=disable
      POSTGRES_URL: postgres://test_user:test_pass@postgres:5432/decorebator_test?sslmode=disable
      TEST_DATABASE_URL: postgres://test_user:test_pass@postgres:5432/decorebator_test?sslmode=disable
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_HOST: minio
      MINIO_PORT: 9000

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
      POSTGRES_DB: decorebator_test
      POSTGRES_HOST_AUTH_METHOD: trust
    env_file:
      - .env.test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data  # In-memory for speed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d decorebator_test"]
      interval: 5s
      timeout: 5s
      retries: 5 

volumes:
  go-mod-cache:
