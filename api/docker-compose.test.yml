name: decorebator-test
services:
  
  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6380:6379"
    tmpfs:
      - /data  # In-memory for speed
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    env_file:
      - .env.test
    ports:
      - "9009:9000"
      - "9091:9001"
    command: server /data --console-address ":9001"
    tmpfs:
      - /data  # In-memory for speed
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/decorebator;
      mc anonymous set download myminio/decorebator;
      sleep infinity;"

  main:                         
    image: golang:1.22
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - .:/app    
      - /home/lucas/go/pkg/mod:/go/pkg/mod # '/home/lucas/go/pkg/mod' comes from `go env GOMODCACHE`
    working_dir: /app
    command: go test -coverprofile=coverage.out -cover -v ./tests/integration/...
    env_file:
      - .env.test

  postgres:
    image: postgres:15.3
    env_file:
      - .env.test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data  # In-memory for speed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5 
