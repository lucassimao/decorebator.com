version: '3.9'
name: decorebator
services:
  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
  minio:
    image: minio/minio:latest
    env_file:
      - .env  # Load environment variables from .env file    
    ports:
      - "${MINIO_PORT}:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001" 
  postgres:
    image: postgres:15.3
    env_file:
      - .env  # Load environment variables from .env file
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: 
    name: api_postgres_data
    external: true
  minio-data: 
    name: api_minio-data
    external: true