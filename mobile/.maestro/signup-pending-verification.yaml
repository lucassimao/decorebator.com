appId: com.lsimaocosta.decorebator
name: Signup requires email verification before sign in
tags:
  - smoke
  - auth
---
- clearState
- launchApp
- runFlow:
    when:
      visible: "http://10.0.2.2:8081"
    commands:
      - tapOn: "http://10.0.2.2:8081"
- extendedWaitUntil:
    visible: "This is the developer menu. It gives you access to useful tools in your development builds."
    timeout: 15000
- runFlow:
    when:
      visible: "This is the developer menu. It gives you access to useful tools in your development builds."
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Connected to:"
    commands:
      - back
- extendedWaitUntil:
    visible: "Welcome to"
    timeout: 15000
- tapOn: "Skip"
- extendedWaitUntil:
    visible: "Sign Up"
    timeout: 5000
- tapOn:
    id: "email-input"
- eraseText: 100
- evalScript: ${output.signupEmail = 'maestro-pending-' + Date.now() + '@example.com'}
- inputText: ${output.signupEmail}
- tapOn:
    id: "fullname-input"
- inputText: "Maestro Pending"
- tapOn:
    id: "password-input"
- eraseText: 100
- inputText: "maestro-password"
- tapOn:
    id: "signup-submit-button"
- assertVisible: "Check your email for account instructions"
- extendedWaitUntil:
    visible: "Welcome back!"
    timeout: 10000
